<body>
<div id="app" class="app"><div class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark">K</span> KNOWLEDGE OS</div><div class="top-copy"><h1>ビジネスを、理解する力へ。</h1><div class="subtitle">日経ニュースを、使える知識に変える個人ライブラリ。</div></div></div></div><main class="main"><p class="muted">データを読み込んでいます…</p></main></div>
<div id="modal-root"></div><div id="toast-root"></div>
<script>
(()=>{'use strict';
const DBNAME='knowledge-os-v1', DBVER=1;
const GENRES=[{id:'macro',name:'経済・金融',color:'#2b8eae',icon:'◎'},{id:'industry',name:'企業・業界',color:'#d38b42',icon:'▦'},{id:'finance',name:'財務・会計',color:'#8471c1',icon:'▥'},{id:'international',name:'国際・政策',color:'#6098bb',icon:'◈'},{id:'technology',name:'技術・産業',color:'#27a68e',icon:'✧'},{id:'governance',name:'経営・ガバナンス',color:'#c96f83',icon:'◇'},{id:'other',name:'その他',color:'#8796a2',icon:'•'}];
const navs=[['home','⌂','ホーム'],['new','＋','記録'],['library','▤','知識庫'],['review','◉','復習'],['calendar','▦','履歴']];
const state={db:null,entries:[],checks:[],reviews:[],view:'home',search:'',genre:'all',sort:'newest',calendarMonth:null,selectedDate:null,modal:null,editingId:null,reviewId:null,reviewReveal:false,optionalReviewId:null,weeklyTarget:6,entryDate:null,formAdvanced:false,filterMastery:'all'};
const $=s=>document.querySelector(s);
const dstr=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const parseDate=s=>new Date(s+'T12:00:00');
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(parseDate(s).getTime())&&dstr(parseDate(s))===s;
const shiftDate=(s,days)=>{const d=parseDate(s);d.setDate(d.getDate()+days);return dstr(d)};
const humanDate=s=>{if(!s)return '';const d=parseDate(s);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`};
const weekdays=['日','月','火','水','木','金','土'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{try{const x=new URL(String(u));return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}};
const uid=()=>('crypto'in window && crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
const g=id=>GENRES.find(x=>x.id===id)||GENRES[6];
const today=()=>dstr();
const formatShort=s=>{const d=parseDate(s);return `${d.getMonth()+1}/${d.getDate()}`};
const showToast=txt=>{const root=$('#toast-root');root.innerHTML=`<div class="toast" role="status">${esc(txt)}</div>`;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>{root.innerHTML=''},3200)};
const tx=(store,mode,action)=>new Promise((resolve,reject)=>{const t=state.db.transaction(store,mode),req=action(t.objectStore(store));t.oncomplete=()=>resolve(req.result);t.onerror=()=>reject(t.error||req.error);t.onabort=()=>reject(t.error||new Error('保存処理が中断されました'))});
const all=s=>tx(s,'readonly',x=>x.getAll());
const put=(s,obj)=>tx(s,'readwrite',x=>x.put(obj));
const del=(s,key)=>tx(s,'readwrite',x=>x.delete(key));
const clear=s=>tx(s,'readwrite',x=>x.clear());
function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('このブラウザはIndexedDBに対応していません。'));return}const r=indexedDB.open(DBNAME,DBVER);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('entries'))db.createObjectStore('entries',{keyPath:'id'});if(!db.objectStoreNames.contains('checks'))db.createObjectStore('checks',{keyPath:'date'});if(!db.objectStoreNames.contains('reviews'))db.createObjectStore('reviews',{keyPath:'id'});if(!db.objectStoreNames.contains('settings'))db.createObjectStore('settings',{keyPath:'key'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('別のタブでアプリが開かれています。'))})}
async function refresh(){[state.entries,state.checks,state.reviews]=await Promise.all([all('entries'),all('checks'),all('reviews')]);state.entries.sort((a,b)=>b.date.localeCompare(a.date)||(b.updatedAt||'').localeCompare(a.updatedAt||''));render()}
const checkFor=d=>state.checks.find(x=>x.date===d);
const entriesFor=d=>state.entries.filter(x=>x.date===d);
const done=d=>!!checkFor(d)?.done;
const due=()=>state.entries.filter(x=>x.nextReview&&x.nextReview<=today()).sort((a,b)=>a.nextReview.localeCompare(b.nextReview)||a.date.localeCompare(b.date));
const mastery=e=>Number(e.stage||0)>=3;
function streak(){let x=today();if(!done(x))x=shiftDate(x,-1);let n=0;while(done(x)&&n<30000){n++;x=shiftDate(x,-1)}return n}
function last7(){return Array.from({length:7},(_,i)=>shiftDate(today(),i-6))}
function weeklyDays(){const d=parseDate(today());const offset=(d.getDay()+6)%7;const m=shiftDate(today(),-offset);return Array.from({length:7},(_,i)=>shiftDate(m,i))}

const empty=(heading,msg,btn='')=>`<div class="empty"><div class="empty-icon">✦</div><div class="empty-title">${esc(heading)}</div><p class="small">${esc(msg)}</p>${btn?`<div style="margin-top:14px">${btn}</div>`:''}</div>`;
const articleCard=e=>`<button class="article" data-detail="${esc(e.id)}"><div class="article-top">${category(e.genre)}<span class="article-meta">${esc(formatShort(e.date))} ${mastery(e)?' · 定着中':''}</span></div><div class="article-title">${esc(e.title)}</div><div class="article-text">${esc(textSummary(e))}</div>${e.company?`<div class="article-meta" style="margin-top:8px">${esc(e.company)}</div>`:''}</button>`;

function home(){const day=today(),items=entriesFor(day),isDone=done(day),days=weeklyDays(),wDone=days.filter(done).length,weekPct=Math.min(100,100*wDone/(state.weeklyTarget||6)),pending=due().length,retained=state.entries.filter(mastery).length;
return `<div class="hero-card"><div class="hero-left"><div><span class="pill ${isDone?'':'amber'}">${isDone?'✓ 本日の学習完了':items.length?'● 記録済み・確認待ち':'○ 本日の学習はこれから'}</span><div class="hero-title" style="margin-top:13px">${humanDate(day)} <span class="small muted">(${weekdays[parseDate(day).getDay()]})</span></div><p class="hero-desc" style="margin:9px 0 0">新聞記事を1本選び、「何が起きた・なぜ・企業への影響」を自分の言葉で記録しよう。</p></div><div class="button-row"><button class="btn primary" data-view="new">＋ 今日の知識を記録</button><button class="btn outline" data-view="review">復習する ${pending?`<strong>(${pending})</strong>`:''}</button></div></div><div class="today-side"><div class="side-row"><div><div class="tiny strong muted">TODAY'S CHECK</div><div class="strong" style="margin-top:3px">本日の記録 ${items.length}件</div></div><button class="big-check ${isDone?'done':''}" data-action="toggle-today" title="今日の学習をチェック" aria-label="今日の学習をチェック" ${!items.length?'disabled':''}>${isDone?'✓':'○'}</button></div><div class="small muted">${items.length?(isDone?'今日のインプットが完了しました。':'説明できるか確認したら、右の○をタップ。'):'先に1件記録するとチェックできます。'}</div><div style="border-top:1px solid #cde4df;padding-top:12px"><div class="side-row"><div class="small strong">今週の学習日</div><div class="small strong">${wDone} / ${state.weeklyTarget}日</div></div><div class="progress-track" style="margin-top:9px"><div class="progress-fill" style="width:${weekPct}%"></div></div><div class="tiny muted" style="margin-top:5px">週の目標は設定から変更できます。</div></div></div></div>
<div class="stats"><div class="card stat"><div class="stat-label">蓄積した知識</div><div class="stat-num">${state.entries.length}<span class="tiny muted"> 件</span></div><div class="stat-foot">全ジャンル合計</div></div><div class="card stat"><div class="stat-label">学習継続</div><div class="stat-num">${streak()}<span class="tiny muted"> 日</span></div><div class="stat-foot">チェック済みの連続日数</div></div><div class="card stat"><div class="stat-label">復習する知識</div><div class="stat-num ${pending?'stat-accent':''}">${pending}<span class="tiny muted"> 件</span></div><div class="stat-foot">期限が今日以前のもの</div></div><div class="card stat"><div class="stat-label">定着が進んだ知識</div><div class="stat-num">${retained}<span class="tiny muted"> 件</span></div><div class="stat-foot">「覚えた」3回以上</div></div></div>
<div class="dashboard-grid"> <div><section>${heading('過去7日間の学習','記録した日と学習チェック') }<div class="card card-pad"><div class="weekday-bars">${last7().map(x=>{const c=entriesFor(x).length;return `<div class="daybar"><div class="bar ${done(x)?'active':''}" style="height:${Math.min(84,Math.max(5,c*30))}px" title="${x}：${c}件記録"></div><div class="daybar-label">${weekdays[parseDate(x).getDay()]} ${formatShort(x)}</div></div>`}).join('')}</div><div class="small muted" style="margin-top:12px">濃色＝学習チェック済み / バーの高さ＝記事数</div></div></section></div><div><section>${heading('ジャンル別の知識','記事を記録すると自動で集約',`<button class="link-button" data-view="library">知識庫を見る ›</button>`)}<div class="card card-pad"><div class="genre-grid">${GENRES.slice(0,6).map(x=>`<button class="genre-box" data-genre-nav="${x.id}"><span class="genre-dot" style="background:${x.color}"></span><div style="flex:1;min-width:0"><div class="genre-box-name">${esc(x.name)}</div><div class="genre-box-count">${state.entries.filter(e=>e.genre===x.id).length}</div></div></button>`).join('')}</div></div></section></div></div>
${heading('最近の記録','今日の記録から過去の知識へ',`<button class="link-button" data-view="library">すべて見る ›</button>`)}<div class="two-col-list">${state.entries.slice(0,4).map(articleCard).join('')||empty('記録はまだありません','最初のニュースを登録すると、ここに蓄積されます。',`<button class="btn primary sm" data-view="new">記録する</button>`)}</div>

function recordView(){const editing=state.editingId&&state.entries.find(x=>x.id===state.editingId);const e=editing||{};const selDate=state.entryDate||today();return `<section class="maxw"><div class="library-hero"><div class="small muted">読む → 考える → 残す。3〜5分で1件を蓄積。</div><button class="btn ghost sm" data-view="home">ホームに戻る</button></div><div class="card card-pad"><form id="entry-form"><div class="form-grid"><div class="field"><label for="entry-date">学んだ日 <span class="required">*</span></label><input type="date" id="entry-date" name="date" required value="${esc(e.date||selDate)}"></div><div class="field"><label for="genre">ジャンル <span class="required">*</span></label><select id="genre" name="genre">${GENRES.map(x=>`<option value="${x.id}" ${e.genre===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><div class="field" style="margin-top:17px"><label for="title">記事・テーマのタイトル <span class="required">*</span></label><input id="title" name="title" required maxlength="160" placeholder="例：金利上昇が企業に与える影響" value="${esc(e.title||'')}"></div><div class="field"><label for="fact">① 何が起きた？ <span class="required">*</span> <span class="hint">事実やニュースの要点</span></label><textarea id="fact" name="fact" required placeholder="記事を見ずに1〜2文で説明">${esc(e.fact||'')}</textarea></div><div class="field"><label for="why">② なぜ起きた？ <span class="hint">背景・原因</span></label><textarea id="why" name="why" placeholder="原因や背景を自分の言葉で">${esc(e.why||'')}</textarea></div><div class="field"><label for="business">③ 企業・業界への影響は？ <span class="hint">誰に、どう影響するか</span></label><textarea id="business" name="business" placeholder="例：借入の多い企業で資金調達コストが増加する可能性">${esc(e.business||'')}</textarea></div><div class="field"><label for="audit">④ 財務・監査の視点では？ <span class="hint">任意・わからなければ空欄でOK</span></label><textarea id="audit" name="audit" placeholder="例：支払利息、資産の減損、継続企業などの検討">${esc(e.audit||'')}</textarea></div><div class="help-card">★ 入力のコツ：記事の文章を貼るより、読んだ後に画面を閉じて思い出しながら書くと、知識の定着につながります。</div><div class="collapse"><button type="button" class="details-toggle" data-action="toggle-advanced" aria-expanded="${state.formAdvanced}">＋ 詳細項目（企業・タグ・URL・復習問題） <span>${state.formAdvanced?'−':'＋'}</span></button><div class="collapse-body ${state.formAdvanced?'':'hide'}" id="advanced-body"><div class="form-grid"><div class="field"><label for="company">会社名・業界</label><input id="company" name="company" placeholder="例：自動車業界・トヨタ" value="${esc(e.company||'')}"></div><div class="field"><label for="tags">タグ <span class="hint">カンマで区切る</span></label><input id="tags" name="tags" placeholder="例：金利, 資金調達, 設備投資" value="${esc((e.tags||[]).join(', '))}"></div></div><div class="field" style="margin-top:16px"><label for="source">記事URL <span class="hint">引用元リンク</span></label><input type="url" id="source" name="source" placeholder="https://www.nikkei.com/..." value="${esc(e.source||'')}"></div><div class="field"><label for="finance">財務諸表への具体的な影響</label><textarea id="finance" name="finance" placeholder="例：営業CF、のれん、棚卸資産評価、金利費用など">${esc(e.finance||'')}</textarea></div><div class="field"><label for="lesson">一言で学んだこと</label><textarea id="lesson" name="lesson" placeholder="次回のニュースにも使える知識・法則">${esc(e.lesson||'')}</textarea></div><div class="field"><label for="question">復習で自分に出す質問 <span class="hint">省略時は記事の要点を説明</span></label><input id="question" name="question" placeholder="例：利上げが企業の財務諸表に与える影響は？" value="${esc(e.question||'')}"></div><div class="field"><label for="answer">その質問への答え <span class="hint">省略時は記録した内容を表示</span></label><textarea id="answer" name="answer" placeholder="自分の言葉での答え">${esc(e.answer||'')}</textarea></div></div></div><div class="form-actions"><button type="button" class="btn outline" data-action="cancel-edit">キャンセル</button><button type="submit" class="btn primary">${editing?'変更を保存':'知識を保存する'} ✓</button></div></form></div></section>`}
function library(){let list=state.entries;const q=state.search.normalize('NFKC').toLowerCase().trim().split(/\s+/).filter(Boolean);if(state.genre!=='all')list=list.filter(x=>x.genre===state.genre);if(state.filterMastery==='mastered')list=list.filter(mastery);if(state.filterMastery==='learning')list=list.filter(x=>!mastery(x));if(q.length)list=list.filter(x=>{const corpus=[x.title,x.fact,x.why,x.business,x.finance,x.audit,x.lesson,x.company,x.date,x.answer,x.question,...(x.tags||[]),g(x.genre).name].join(' ').normalize('NFKC').toLowerCase();return q.every(t=>corpus.includes(t))});list=[...list].sort((a,b)=>state.sort==='oldest'?a.date.localeCompare(b.date):state.sort==='review'?String(a.nextReview||'').localeCompare(String(b.nextReview||'')):b.date.localeCompare(a.date));return `<div class="library-hero"><div class="muted small">全${state.entries.length}件の知識を検索・分類・編集できます。</div><button class="btn primary sm" data-view="new">＋ 追加</button></div><div class="card card-pad"><label class="small strong" for="library-search">知識を検索</label><div style="margin-top:7px"><input class="search" id="library-search" autocomplete="off" placeholder="タイトル・キーワード・企業・記事内容を横断検索" value="${esc(state.search)}"></div><div class="chip-row" style="margin-top:13px">${[{id:'all',name:'すべて'},...GENRES].map(x=>`<button class="chip ${state.genre===x.id?'active':''}" data-filter-genre="${x.id}">${esc(x.name)} (${x.id==='all'?state.entries.length:state.entries.filter(y=>y.genre===x.id).length})</button>`).join('')}</div><div class="control-row"><select class="filter" id="mastery-filter" aria-label="学習状態"><option value="all" ${state.filterMastery==='all'?'selected':''}>学習状態：すべて</option><option value="learning" ${state.filterMastery==='learning'?'selected':''}>学習中</option><option value="mastered" ${state.filterMastery==='mastered'?'selected':''}>定着が進んだ知識</option></select><select class="filter" id="sort-filter" aria-label="並び順"><option value="newest" ${state.sort==='newest'?'selected':''}>日付の新しい順</option><option value="oldest" ${state.sort==='oldest'?'selected':''}>日付の古い順</option><option value="review" ${state.sort==='review'?'selected':''}>復習予定日の順</option></select></div></div><div class="section-head"><h2>検索結果 <span class="muted small">${list.length} 件</span></h2><button class="link-button" data-action="csv-export">CSV出力</button></div><div class="two-col-list">${list.map(articleCard).join('')||empty('該当する知識はありません','キーワードやジャンルを変えてみてください。')}</div>`}
function review(){const tasks=due(),allCount=state.entries.length;let active=tasks.find(x=>x.id===state.reviewId)||(state.optionalReviewId?state.entries.find(x=>x.id===state.optionalReviewId):null)||tasks[0];if(active)state.reviewId=active.id;else state.reviewId=null;let reviewBody=active?`<div class="review-card"><div class="article-meta">${category(active.genre)} · ${humanDate(active.date)}の記録 · 復習 ${active.reviewCount||0}回</div><div class="review-question">${esc(active.question||`「${active.title}」の要点・背景・企業への影響を説明できますか？`)}</div>${!state.reviewReveal?`<p class="muted small">記事やノートを見ず、口に出して答えてから確認してください。</p><button class="btn primary full" data-action="review-reveal">答えを確認する</button>`:`<div class="review-answer">${active.answer?`<div class="answer-label">設定した答え</div><div class="answer-block">${esc(active.answer)}</div>`:''}${[ ['何が起きた',active.fact],['背景',active.why],['企業・業界への影響',active.business],['財務・監査の視点',active.audit],['財務諸表',active.finance],['学び',active.lesson]].filter(([_,x])=>!!x).map(([name,v])=>`<div class="answer-label">${name}</div><div class="answer-block">${esc(v)}</div>`).join('')}</div><div class="small muted">思い出せた度合いを選択すると、次の復習日を自動で設定します。</div><div class="rating-row"><button class="btn danger" data-rate="forgot">× 忘れた</button><button class="btn ghost" data-rate="vague">△ あいまい</button><button class="btn primary" data-rate="known">✓ 覚えた</button></div>`}</div>`:empty('今日の復習は完了です','期限が来た知識はここに自動で表示されます。');return `<div class="library-hero"><div><div class="strong">本日の復習</div><div class="muted small">「記憶から取り出す」ことを優先しましょう。</div></div><span class="pill">${tasks.length} 件の復習待ち</span></div><div class="maxw"><div class="summary-card" style="margin-bottom:15px">復習間隔は、基本的に<strong>翌日 → 3日 → 7日 → 14日 → 30日 → 90日</strong>。忘れた場合は翌日に再出題します。</div>${reviewBody}${allCount&&!active?`<div style="margin-top:12px"><button class="btn outline" data-action="optional-review">知識庫から任意復習</button></div>`:''}</div>${heading('復習待ちの知識','期限が来た順に表示')}${tasks.length?`<div class="two-col-list">${tasks.slice(0,8).map(x=>`<button class="article" data-review-select="${esc(x.id)}"><div class="article-top">${category(x.genre)}<span class="tiny muted">${x.nextReview===today()?'今日':`${Math.abs(Math.round((parseDate(today())-parseDate(x.nextReview))/86400000))}日超過`}</span></div><div class="article-title">${esc(x.title)}</div></button>`).join('')}</div>`:empty('復習待ちは0件','新しく記録した知識は翌日から復習が始まります。')}`}
function monthShift(m,delta){const d=parseDate(m+'-01');d.setMonth(d.getMonth()+delta);return dstr(d).slice(0,7)}
function calendar(){const m=state.calendarMonth||today().slice(0,7),sel=state.selectedDate||today(),[year,month]=m.split('-').map(Number),first=new Date(year,month-1,1).getDay(),last=new Date(year,month,0).getDate(),numCells=Math.ceil((first+last)/7)*7,cal=[];for(let i=0;i<numCells;i++){const dt=new Date(year,month-1,i-first+1),ds=dstr(dt),outside=dt.getMonth()!==month-1,records=entriesFor(ds).length,isDone=done(ds);cal.push(`<button class="cal-cell ${outside?'outside':''} ${ds===sel?'selected':''} ${ds===today()?'today':''}" data-select-date="${ds}"><span class="date-num">${dt.getDate()}</span><span class="indicators">${records?`<span class="cal-count">${records}件</span>`:''}${isDone?'<span class="cal-done">✓</span>':''}</span></button>`)}const records=entriesFor(sel),isDone=done(sel);return `<div class="calendar-head"><div class="calendar-month">${year}年 ${month}月</div><div class="calendar-controls"><button data-month="-1" aria-label="前月">‹</button><button data-month="0" aria-label="今月">今</button><button data-month="1" aria-label="翌月">›</button></div></div><div class="card card-pad"><div class="calendar-grid">${weekdays.map(x=>`<div class="weekday">${x}</div>`).join('')}${cal.join('')}</div><div class="small muted" style="margin-top:13px">✓：学習チェック済み　● 記録件数：その日に学んだ知識</div></div><div class="calendar-bottom"><div class="card card-pad"><div class="small muted">選択した日</div><div class="total-highlight" style="margin:4px 0 12px">${humanDate(sel)}</div><div class="small muted">${records.length}件の記録</div><div style="margin:12px 0" class="pill ${isDone?'':'gray'}">${isDone?'✓ 学習チェック済み':'未チェック'}</div><div class="button-row"><button class="btn ${isDone?'ghost':'primary'} sm" data-action="toggle-selected" ${!records.length?'disabled':''}>${isDone?'チェックを外す':'この日をチェック ✓'}</button><button class="btn outline sm" data-action="new-selected">＋ この日に記録</button></div></div><div><div class="section-head" style="margin-top:0"><h2>この日の記録</h2></div><div class="article-list">${records.map(articleCard).join('')||empty('記録はありません','記事を記録すると日付ごとに表示されます。')}</div></div></div>`}
function render(){const viewBody=({home,new:recordView,library,review,calendar})[state.view]?.()||home();$('#app').innerHTML=topbar()+`<main class="main">${viewBody}</main>`+navbar(); if(state.modal)renderModal()}
function switchView(view){if(!['home','new','library','review','calendar'].includes(view))return;if(view==='new'&&state.view!=='new'){state.editingId=null;state.entryDate=today();state.formAdvanced=false}state.view=view;if(view==='review'){state.reviewReveal=false;state.reviewId=null;state.optionalReviewId=null}render();window.scrollTo({top:0,behavior:'instant'})}

async function toggleCheck(date){if(!entriesFor(date).length){showToast('先にこの日の知識を1件記録してください');return}try{await setCheck(date,!done(date));await refresh();showToast(done(date)?'学習をチェックしました ✓':'チェックを外しました')}catch(e){showToast('保存できませんでした：'+e.message)}}
async function saveEntry(form){const data=new FormData(form),now=new Date().toISOString(),id=state.editingId||uid(),prev=state.entries.find(x=>x.id===id),date=data.get('date'),source=String(data.get('source')||'').trim();if(!validDate(date)){showToast('正しい日付を入力してください');return}if(source&&!safeUrl(source)){showToast('記事URLは http:// または https:// で入力してください');return}
const obj={...(prev||{}),id,date,genre:String(data.get('genre')||'other'),title:String(data.get('title')||'').trim().slice(0,160),fact:String(data.get('fact')||'').trim(),why:String(data.get('why')||'').trim(),business:String(data.get('business')||'').trim(),audit:String(data.get('audit')||'').trim(),finance:String(data.get('finance')||'').trim(),company:String(data.get('company')||'').trim(),tags:String(data.get('tags')||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean).slice(0,30),source:source?safeUrl(source):'',lesson:String(data.get('lesson')||'').trim(),question:String(data.get('question')||'').trim(),answer:String(data.get('answer')||'').trim(),createdAt:prev?.createdAt||now,updatedAt:now,stage:prev?.stage||0,reviewCount:prev?.reviewCount||0,nextReview:prev?.reviewCount?prev.nextReview:shiftDate(date,1)};if(!obj.title||!obj.fact){showToast('タイトルと「何が起きた？」を入力してください');return}if(!GENRES.some(g=>g.id===obj.genre))obj.genre='other';try{await put('entries',obj);state.editingId=null;state.entryDate=null;state.formAdvanced=false;state.view='library';await refresh();showToast(prev?'記録を更新しました':'新しい知識を保存しました ✓')}catch(e){showToast('保存できませんでした：'+e.message)}}
const details=e=>{const tags=(e.tags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join('');return `<div class="entry-detail">${category(e.genre)}<h2>${esc(e.title)}</h2><div class="small muted">${humanDate(e.date)}${e.company?` · ${esc(e.company)}`:''}</div>${tags?`<div class="tags" style="margin:12px 0">${tags}</div>`:''}<div class="summary-card" style="margin:17px 0">復習 ${e.reviewCount||0}回 ／ 学習段階 ${e.stage||0} ／ 次回 ${e.nextReview?humanDate(e.nextReview):'未設定'}</div>${[['何が起きた？',e.fact],['なぜ起きた？',e.why],['企業・業界への影響',e.business],['財務・監査への影響',e.audit],['財務諸表への影響',e.finance],['学んだこと',e.lesson],['復習問題',e.question],['復習の答え',e.answer]].filter(x=>x[1]).map(([label,val])=>`<div class="detail-section"><h3>${label}</h3><p>${esc(val)}</p></div>`).join('')}${e.source?`<div class="detail-section"><h3>出典URL</h3><a href="${esc(safeUrl(e.source))}" target="_blank" rel="noopener noreferrer">${esc(e.source)}</a></div>`:''}<div class="button-row" style="margin-top:18px"><button class="btn primary" data-action="edit-entry" data-id="${esc(e.id)}">編集</button><button class="btn outline" data-action="copy-entry" data-id="${esc(e.id)}">メモをコピー</button><button class="btn danger" data-action="delete-entry" data-id="${esc(e.id)}">削除</button></div></div>`};
function renderModal(){if(!state.modal){$('#modal-root').innerHTML='';document.body.style.overflow='';return}let title='';let body='';if(state.modal.type==='detail'){const e=state.entries.find(x=>x.id===state.modal.id);if(!e){closeModal();return}title='知識の詳細';body=details(e)}else if(state.modal.type==='settings'){title='設定・バックアップ';body=`<div class="setting-block"><div class="setting-title">週の学習目標</div><p class="setting-desc">標準は週6日。日曜日は自由日にできます。</p><div class="control-row"><select id="weekly-target" class="filter" aria-label="週の目標">${[5,6,7].map(n=>`<option value="${n}" ${state.weeklyTarget===n?'selected':''}>週 ${n}日</option>`).join('')}</select><button class="btn primary sm" data-action="save-settings">保存</button></div></div><div class="setting-block"><div class="setting-title">バックアップ（重要）</div><p class="setting-desc">データはこの端末のブラウザ内（IndexedDB）に保存。Safariのデータ削除・機種変更・閲覧モード変更で消える可能性があるため、週1回JSONを書き出してください。</p><div class="button-row"><button class="btn primary sm" data-action="json-export">JSONバックアップを保存</button><button class="btn outline sm" data-action="csv-export">CSVを書き出す</button></div><div style="margin-top:17px"><label class="small strong" for="json-import">JSONバックアップの復元</label><input type="file" id="json-import" accept=".json,application/json" style="display:block;margin:9px 0;width:100%;font-size:12px"><label class="checkbox-line small"><input type="checkbox" id="import-replace"> 既存データを消去して完全に置き換える</label><button class="btn ghost sm" style="margin-top:10px" data-action="json-import">選択したファイルを読み込む</button></div></div><div class="setting-block"><div class="setting-title">新聞記事について</div><p class="setting-desc">日経の記事本文を丸ごと保存・転載するのではなく、自分の言葉で要約し、必要に応じて記事URLを記録してください。AIによる自動取得・自動解析は搭載していません。</p></div><p class="warn">利用料・サーバー費用・API費用は不要です。データの自動同期やクラウドバックアップはありません。アプリを削除する前にバックアップを取ってください。</p>`}$('#modal-root').innerHTML=`<div class="drawer-wrap" role="presentation" id="modal-backdrop"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-head"><div class="drawer-title">${title}</div><button class="close" data-action="close-modal" aria-label="閉じる">×</button></div><div class="drawer-body">${body}</div></section></div>`;document.body.style.overflow='hidden'}
function openDetail(id){if(!state.entries.find(x=>x.id===id))return;state.modal={type:'detail',id};renderModal()}
function closeModal(){state.modal=null;$('#modal-root').innerHTML='';document.body.style.overflow=''}
function noteText(e){return `【${e.title}】\n日付：${humanDate(e.date)}\n分野：${g(e.genre).name}\n${e.company?'企業・業界：'+e.company+'\n':''}何が起きた：${e.fact}\n背景：${e.why}\n企業への影響：${e.business}\n監査・財務への視点：${e.audit}\n${e.finance?'財務諸表：'+e.finance+'\n':''}${e.lesson?'学び：'+e.lesson+'\n':''}${e.source?'出典：'+e.source+'\n':''}`}
function downloadFile(name,body,type){const blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
const qcsv=v=>'"'+String(v??'').replaceAll('"','""')+'"';
function exportCSV(){const cols=[['date','日付'],['genre','ジャンル'],['title','タイトル'],['company','企業・業界'],['fact','何が起きた'],['why','背景'],['business','企業への影響'],['audit','監査への影響'],['finance','財務諸表への影響'],['lesson','学んだこと'],['tags','タグ'],['source','出典URL'],['question','復習問題'],['answer','答え'],['stage','学習段階'],['nextReview','次回復習日']];const rows=[cols.map(x=>x[1]),...state.entries.map(e=>cols.map(([key])=>key==='genre'?g(e.genre).name:key==='tags'?(e.tags||[]).join('・'):e[key]||''))];downloadFile(`knowledge-os-${today()}.csv`,'\uFEFF'+rows.map(r=>r.map(qcsv).join(',')).join('\r\n'),'text/csv;charset=utf-8');showToast('CSVを書き出しました')}
function exportJSON(){const payload={app:'Knowledge OS',version:1,exportedAt:new Date().toISOString(),entries:state.entries,checks:state.checks,reviews:state.reviews,settings:{weeklyTarget:state.weeklyTarget}};downloadFile(`knowledge-os-backup-${today()}.json`,JSON.stringify(payload,null,2),'application/json');showToast('バックアップを保存しました')}
function restoreAtomic(entries,checks,reviews,replace){
 return new Promise((resolve,reject)=>{
  const transaction=state.db.transaction(['entries','checks','reviews'],'readwrite');
  transaction.oncomplete=()=>resolve();
  transaction.onerror=()=>reject(transaction.error||new Error('復元処理に失敗しました'));
  transaction.onabort=()=>reject(transaction.error||new Error('復元処理を中断しました'));
  if(replace){for(const name of ['entries','checks','reviews'])transaction.objectStore(name).clear()}
  for(const e of entries)transaction.objectStore('entries').put(e);
  for(const e of checks)transaction.objectStore('checks').put(e);
  for(const e of reviews)transaction.objectStore('reviews').put(e);
 });
}
async function importJSON(){
 const inp=$('#json-import'),file=inp?.files?.[0];
 if(!file){showToast('JSONファイルを選択してください');return}
 if(file.size>20*1024*1024){showToast('20MB以下のファイルを選択してください');return}
 let raw;try{raw=JSON.parse(await file.text())}catch{showToast('JSONを読み込めませんでした');return}
 if(!raw||raw.app!=='Knowledge OS'||raw.version!==1||!Array.isArray(raw.entries)||!Array.isArray(raw.checks)||!Array.isArray(raw.reviews)){showToast('対応していないバックアップ形式です');return}
 if(raw.entries.length>25000||raw.checks.length>25000||raw.reviews.length>250000){showToast('データ件数が多すぎます');return}
 const fields=['title','fact','why','business','audit','finance','company','source','lesson','question','answer'];
 const validEntries=raw.entries.every(e=>e&&typeof e.id==='string'&&e.id.length>0&&e.id.length<=200&&validDate(e.date)&&fields.every(k=>e[k]===undefined||typeof e[k]==='string')&&typeof e.title==='string'&&e.title.trim().length>0&&typeof e.fact==='string'&&(!e.tags||(Array.isArray(e.tags)&&e.tags.every(t=>typeof t==='string')))&&(!e.nextReview||validDate(e.nextReview))&&(!e.stage||(Number.isInteger(e.stage)&&e.stage>=0&&e.stage<=6)));
 const validChecks=raw.checks.every(x=>x&&validDate(x.date)&&typeof x.done==='boolean');
 const validReviews=raw.reviews.every(x=>x&&typeof x.id==='string'&&x.id.length>0&&typeof x.entryId==='string'&&x.entryId.length>0);
 if(!validEntries||!validChecks||!validReviews){showToast('バックアップの内容に不正なデータがあります');return}
 const replace=!!$('#import-replace')?.checked;
 if(!confirm(replace?'現在の知識・履歴を全件削除して復元します。続行しますか？':'同じIDのデータは上書きし、他は追加します。続行しますか？'))return;
 try{
  const entries=raw.entries.map(x=>({...x,genre:GENRES.some(q=>q.id===x.genre)?x.genre:'other',source:safeUrl(x.source||''),tags:Array.isArray(x.tags)?x.tags.filter(y=>typeof y==='string').slice(0,30):[]}));
  await restoreAtomic(entries,raw.checks,raw.reviews,replace);
  if([5,6,7].includes(Number(raw.settings?.weeklyTarget))){state.weeklyTarget=Number(raw.settings.weeklyTarget);await put('settings',{key:'weeklyTarget',value:state.weeklyTarget})}
  closeModal();await refresh();showToast(`復元完了：${raw.entries.length}件の知識`)
 }catch(e){showToast('復元に失敗しました：'+e.message)}
}
async function reviewRate(rate){const e=state.entries.find(x=>x.id===state.reviewId);if(!e)return;const stage=rate==='known'?Math.min(6,(e.stage||0)+1):rate==='forgot'?0:Math.max(0,(e.stage||0)-1);const intervals=[1,3,7,14,30,90,90],now=new Date().toISOString();const next=shiftDate(today(),rate==='known'?intervals[stage]:1);try{await put('entries',{...e,stage,reviewCount:(e.reviewCount||0)+1,lastReviewed:today(),nextReview:next,updatedAt:now});await put('reviews',{id:uid(),entryId:e.id,date:today(),rating:rate,createdAt:now,stage});state.reviewReveal=false;state.reviewId=null;state.optionalReviewId=null;await refresh();showToast('復習を記録しました。次回：'+humanDate(next))}catch(err){showToast('復習を保存できませんでした：'+err.message)}}
async function deleteEntry(id){const e=state.entries.find(x=>x.id===id);if(!e)return;if(!confirm(`「${e.title}」を削除しますか？\nこの操作は元に戻せません。`))return;try{await del('entries',id);for(const item of state.reviews.filter(x=>x.entryId===id))await del('reviews',item.id);closeModal();await refresh();showToast('記録を削除しました')}catch(err){showToast('削除に失敗しました：'+err.message)}}
const copyText=async text=>{try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('コピーが制限されています')}showToast('クリップボードにコピーしました')}catch{showToast('コピーできませんでした。HTTPSから開いてください')}};
function handlers(){document.addEventListener('click',async ev=>{if(ev.target.id==='modal-backdrop'){closeModal();return}const v=ev.target.closest('[data-view]');if(v){switchView(v.dataset.view);return}const detail=ev.target.closest('[data-detail]');if(detail){openDetail(detail.dataset.detail);return}const gn=ev.target.closest('[data-genre-nav]');if(gn){state.genre=gn.dataset.genreNav;switchView('library');return}const fg=ev.target.closest('[data-filter-genre]');if(fg){state.genre=fg.dataset.filterGenre;render();return}const ds=ev.target.closest('[data-select-date]');if(ds){state.selectedDate=ds.dataset.selectDate;state.calendarMonth=ds.dataset.selectDate.slice(0,7);render();return}const mm=ev.target.closest('[data-month]');if(mm){state.calendarMonth=mm.dataset.month==='0'?today().slice(0,7):monthShift(state.calendarMonth||today().slice(0,7),Number(mm.dataset.month));render();return}const sr=ev.target.closest('[data-review-select]');if(sr){state.reviewId=sr.dataset.reviewSelect;state.reviewReveal=false;render();window.scrollTo({top:0,behavior:'smooth'});return}const rate=ev.target.closest('[data-rate]');if(rate){await reviewRate(rate.dataset.rate);return}const act=ev.target.closest('[data-action]');if(!act)return;switch(act.dataset.action){case 'settings':state.modal={type:'settings'};renderModal();break;case 'close-modal':closeModal();break;case 'toggle-today':await toggleCheck(today());break;case 'toggle-selected':await toggleCheck(state.selectedDate||today());break;case 'new-selected':state.editingId=null;state.entryDate=state.selectedDate||today();state.formAdvanced=false;state.view='new';render();window.scrollTo(0,0);break;case 'cancel-edit':state.editingId=null;state.formAdvanced=false;switchView('home');break;case 'toggle-advanced':{const form=$('#entry-form');const current=new FormData(form);const values=Object.fromEntries(current.entries());state.formAdvanced=!state.formAdvanced;const part=$('#advanced-body');part.classList.toggle('hide',!state.formAdvanced);act.setAttribute('aria-expanded',String(state.formAdvanced));act.lastElementChild.textContent=state.formAdvanced?'−':'＋';if(state.formAdvanced){['company','tags','source','finance','lesson','question','answer'].forEach(x=>{if(form.elements[x])form.elements[x].value=values[x]||''})}break}case 'review-reveal':state.reviewReveal=true;render();break;case 'optional-review':{const first=[...state.entries].sort((a,b)=>(a.lastReviewed||'').localeCompare(b.lastReviewed||''))[0];if(first){state.reviewId=first.id;state.optionalReviewId=first.id;state.reviewReveal=false;render();showToast('任意復習：このカードを確認してください')}break}case 'edit-entry':{const e=state.entries.find(x=>x.id===act.dataset.id);if(!e)return;closeModal();state.editingId=e.id;state.formAdvanced=!!(e.company||e.tags?.length||e.source||e.finance||e.lesson||e.question||e.answer);state.entryDate=e.date;state.view='new';render();window.scrollTo(0,0);break}case 'delete-entry':await deleteEntry(act.dataset.id);break;case 'copy-entry':{const e=state.entries.find(x=>x.id===act.dataset.id);if(e)await copyText(noteText(e));break}case 'csv-export':exportCSV();break;case 'json-export':exportJSON();break;case 'json-import':await importJSON();break;case 'save-settings':{const n=Number($('#weekly-target').value);state.weeklyTarget=[5,6,7].includes(n)?n:6;await put('settings',{key:'weeklyTarget',value:state.weeklyTarget});showToast('設定を保存しました');render();break}}});document.addEventListener('submit',async ev=>{if(ev.target.id==='entry-form'){ev.preventDefault();await saveEntry(ev.target)}});document.addEventListener('input',ev=>{if(ev.target.id==='library-search'){state.search=ev.target.value;if(ev.isComposing)return;const selection=ev.target.selectionStart;render();const inp=$('#library-search');inp?.focus();inp?.setSelectionRange(selection,selection)}});document.addEventListener('compositionend',ev=>{if(ev.target.id==='library-search'){state.search=ev.target.value;render();$('#library-search')?.focus()}});document.addEventListener('change',ev=>{if(ev.target.id==='sort-filter'){state.sort=ev.target.value;render()}if(ev.target.id==='mastery-filter'){state.filterMastery=ev.target.value;render()}});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.modal)closeModal()})}
async function init(){try{state.db=await openDB();const setting=await tx('settings','readonly',x=>x.get('weeklyTarget'));if(setting&&[5,6,7].includes(Number(setting.value)))state.weeklyTarget=Number(setting.value);state.calendarMonth=today().slice(0,7);state.selectedDate=today();state.entryDate=today();handlers();await refresh();if('serviceWorker' in navigator&&window.location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}}catch(e){$('#app').innerHTML=`<div class="topbar"><div class="topbar-inner"><div class="brand">KNOWLEDGE OS</div><h1 style="margin-top:30px">保存領域を開けませんでした</h1></div></div><main class="main"><div class="card card-pad"><p>${esc(e.message)}</p><p>プライベートブラウズやストレージ制限の影響の可能性があります。通常のSafariまたはChromeでHTTPSから開いてください。</p></div></main>`}}
init();
})();
