function taskScore(t){return t.status==='review'?-3:t.status==='done'?1:0}function examDays(date){return Math.max(0,Math.ceil((new Date(date+'T12:00:00')-new Date(today()+'T12:00:00'))/DAY))}function projection(){let days=examDays(state.settings.farExam),weeks=days/7,remaining=state.tasks.filter(t=>t.subject==='FAR'&&t.status!=='done').reduce((s,t)=>s+t.minutes,0)/60,estimate=Number(state.settings.farNeed)||386,available=weeks*21,logs=state.logs.filter(l=>l.subject==='FAR'),actual=logs.reduce((s,l)=>s+l.minutes,0)/60;return {days,weeks,remaining,estimate,available,actual,delta:available-estimate}}

function structuredPlanText(dates, slots, from) {
  const rows = slots.filter(slot => slot.date >= from).map(slot => {
    const title = slot.title.replace(/\s+/g, ' ').trim();
    return `${slot.date} ${slot.start}〜${slot.end} ｜ ${slot.subject} ｜ ${title}`;
  });
  return [
    `Study OS｜${dates[0]}〜${dates[6]}（日本時間）`,
    `下記は修正後の学習予定です。対象は${from}〜${dates[6]}の未完了の学習予定です。`,
    '既存のStudy OS由来の学習予定と照合し、一致する予定は追加せず、新規追加・移動・変更・削除の候補を確認用に提示してください。完了済みの学習や、それ以外の予定は変更しないでください。',
    '既存予定を編集できない場合は、変更・取消が必要な旧予定を一覧にしてください。重複や他の予定との時間の重なりがある場合は、登録前に確認してください。',
    '',
    ...(rows.length ? rows : ['対象期間の学習予定はありません。'])
  ].join('\n');

async function copyStructuredPlan() {
  const field = $('structuredText');

  try {
    await navigator.clipboard.writeText(field.value);
    status.textContent = 'コピーしました。Structured AIに貼り付けてください。';
  } catch {
    field.focus();
    field.select();
    status.textContent = 'テキスト欄から手動でコピーしてください。';
  }
}
function weekView(){let w=weekly(selected),slots=planSlots(selected),p=projection();return `<h2>週間スケジュール</h2>${taxRoadmap()}${roadmap()}${structuredExport(w.dates,slots)}<div class="card"><div class="row"><button class="secondary" onclick="selected='${shift(selected,-7)}';render()">‹ 前週</button><b>${w.dates[0]}〜${w.dates[6]}</b><button class="secondary" onclick="selected='${shift(selected,7)}';render()">次週 ›</button></div><div class="grid" style="margin-top:13px"><div class="metric"><small>基本必須枠</small><strong>${fmt(w.required)}</strong></div><div class="metric"><small>通常予備枠</small><strong>${fmt(w.regular)}</strong></div><div class="metric"><small>予定による必須枠減少</small><strong>${fmt(w.lost)}</strong></div><div class="metric"><small>通常予備で回収</small><strong>${fmt(w.bufferUsed)}</strong></div><div class="metric"><small>日曜緊急予備の発動</small><strong>${fmt(w.sunUsed)}</strong></div><div class="metric"><small>なお不足</small><strong>${fmt(w.uncovered)}</strong></div></div><div class="notice ${w.uncovered?'':'good'}" style="margin-top:12px">${w.uncovered?`今週は${fmt(w.uncovered)}不足します。翌週への繰越しと受験日までの影響を確認してください。`:`日曜日の使用：${w.sunUsed?`08:00〜11:00の空き時間に${fmt(w.sunUsed)}`:'なし'}`}。予定登録時に再計算します。</div><div class="actions"><button class="secondary" onclick="mutate(()=>state.settings.sundayProtected=!state.settings.sundayProtected)">${state.settings.sundayProtected?'日曜午前の保護を解除':'日曜午前を予定ありとして保護'}</button></div></div><div class="card"><h3>予定を登録（勉強できない時間）</h3><label>日付</label><input id="eventDate" type="date" value="${selected}"><div class="grid"><div><label>開始</label><input id="eventStart" type="time" value="18:00"></div><div><label>終了</label><input id="eventEnd" type="time" value="20:00"></div></div><label>予定名</label><input id="eventName" placeholder="残業、外出、デートなど"><div class="actions"><button onclick="addEvent()">予定を追加して自動再配分</button></div><p class="fine">勤務・睡眠は固定。予定の時間帯と学習枠が重なる分だけ再配分します。</p></div><div class="card"><h3>曜日ごとの予定</h3>${w.dates.map(d=>{let c=capacity(d),ev=state.events.filter(e=>e.date===d),ds=slots.filter(s=>s.date===d);return `<details ${d===selected?'open':''}><summary>${d.slice(5)}（${names[dow(d)]}）｜${dayLabels[typeOf(d)]}｜必須${fmt(c.freeRequired)}｜実績${fmt(state.logs.filter(l=>l.date===d).reduce((s,l)=>s+l.minutes,0))}</summary><div class="actions"><button class="secondary" onclick="selected='${d}';go('today')">この日の学習枠・予定を移動</button></div>${ev.map(e=>`<div class="line"><div class="row"><div><b>${esc(e.name)}</b><small>${e.start}〜${e.end}</small></div><button class="danger" onclick="deleteEvent('${e.id}')">削除</button></div></div>`).join('')}${ds.map(s=>`<div class="slot ${s.kind}"><b>${s.start}〜${s.end}</b><small>${esc(s.title)}</small></div>`).join('')}</details>`}).join('')}</div><div class="card"><h3>受験日までの逆算（FAR）</h3><div class="grid"><div class="metric"><small>残り日数</small><strong>${p.days}日</strong></div><div class="metric"><small>21h/週の理論容量</small><strong>${Math.round(p.available)}h</strong></div><div class="metric"><small>必要時間の仮見積もり</small><strong>${p.estimate}h</strong></div><div class="metric"><small>差額（仮）</small><strong>${p.delta>=0?'+':''}${Math.round(p.delta)}h</strong></div></div><p class="fine">必要時間は実測値ではありません。週の計画が実行されることを保証せず、合格確率も表しません。</p></div>`}
function addEvent(){let date=$('eventDate').value,start=$('eventStart').value,end=$('eventEnd').value,name=$('eventName').value.trim()||'予定';if(!date||!start||!end||mins(start)>=mins(end))return alert('日付と開始・終了時刻を確認してください');mutate(()=>state.events.push({id:uid(),date,start,end,name}))}function deleteEvent(id){mutate(()=>state.events=state.events.filter(e=>e.id!==id))}
function tasksView(){let all=state.tasks.filter(t=>(filter==='all'||t.subject===filter)&&(!taskQuery||t.name.toLowerCase().includes(taskQuery.toLowerCase()))),done=state.tasks.filter(t=>t.status==='done');return `<h2>教材と習熟度</h2><div class="card"><div class="grid"><div class="metric"><small>FAR講義</small><strong>${done.filter(t=>t.kind==='lecture').length}/27</strong></div><div class="metric"><small>国徴理論</small><strong>${done.filter(t=>t.subject==='国徴'&&t.kind==='theory').length}/49</strong></div><div class="metric"><small>国徴テーマ問題</small><strong>${done.filter(t=>t.subject==='国徴'&&t.kind==='problem').length}/61</strong></div><div class="metric"><small>復習待ち</small><strong>${state.tasks.filter(t=>t.status==='review').length}件</strong></div></div><p class="fine">初期値：講義1〜6視聴済、MCQ第1〜3章は1周済（習熟度未判定）。国徴の項目名・問題番号は仮ラベルです。</p><label>科目</label><select onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>すべて</option><option value="FAR" ${filter==='FAR'?'selected':''}>FAR</option><option value="国徴" ${filter==='国徴'?'selected':''}>国税徴収法</option></select><label>教材を検索</label><input id="searchTasks" value="${esc(taskQuery)}" placeholder="例：社債、滞納処分" onchange="taskQuery=this.value;render()"></div><div class="card"><h3>教材タスクを追加</h3><div class="grid"><div><label>科目</label><select id="taskSubject"><option>FAR</option><option>国徴</option></select></div><div><label>種別</label><select id="taskKind"><option value="mcq">MCQ</option><option value="tbs">TBS</option><option value="theory">理論</option><option value="problem">問題</option><option value="review">復習</option><option value="lecture">講義</option></select></div></div><label>教材・問題番号</label><input id="taskName" placeholder="例：FAR2 Chapter4 MCQ 1〜20"><label>見積もり（分）</label><input id="taskMins" type="number" min="5" value="45"><div class="actions"><button onclick="addTask()">追加</button></div></div><div class="card"><h3>教材一覧（${all.length}件）</h3>${all.map(t=>`<details><summary>${esc(t.name)} <span class="tag ${t.status==='done'?'success':t.status==='review'?'warning':''}">${status(t)}</span></summary><p class="fine">${esc(t.source||'手動')}｜${t.minutes}分｜習熟度${t.mastery||0}%${t.due?'｜復習日'+t.due:''}</p><label>教材名・番号</label><input id="name-${t.id}" value="${esc(t.name)}"><label>推定時間（分）</label><input type="number" id="mins-${t.id}" min="1" value="${t.minutes}"><div class="actions"><button class="secondary" onclick="editTask('${t.id}')">編集を保存</button><button onclick="setStatus('${t.id}','done')">完了</button><button class="secondary" onclick="setStatus('${t.id}','review')">復習待ち</button><button class="secondary" onclick="setStatus('${t.id}','todo')">未着手</button></div></details>`).join('')}</div>`}
function addTask(){let name=$('taskName').value.trim(),minutes=+$('taskMins').value;if(!name||!Number.isFinite(minutes)||minutes<=0)return alert('教材名と所要時間を入力してください');mutate(()=>state.tasks.push({id:uid(),subject:$('taskSubject').value,kind:$('taskKind').value,name,minutes,status:'todo',mastery:0,due:'',source:'手動登録'}))}function editTask(id){let name=$('name-'+id).value.trim(),minutes=+$('mins-'+id).value;if(!name||minutes<=0)return alert('入力を確認してください');mutate(()=>{let t=state.tasks.find(t=>t.id===id);t.name=name;t.minutes=minutes})}function setStatus(id,status){mutate(()=>{let t=state.tasks.find(t=>t.id===id);t.status=status;if(status==='review')t.due=shift(today(),3);else t.due=''})}
function reviewView(){let w=weekly(selected),ls=state.logs.filter(l=>w.dates.includes(l.date)),bySubject=s=>ls.filter(l=>l.subject===s).reduce((a,l)=>a+l.minutes,0),reasons=ls.filter(l=>l.reason);return `<h2>週次レビュー</h2><div class="card"><div class="row"><button class="secondary" onclick="selected='${shift(selected,-7)}';render()">‹</button><b>${w.dates[0]}〜${w.dates[6]}</b><button class="secondary" onclick="selected='${shift(selected,7)}';render()">›</button></div>${weeklyCharts(w,ls)}<h3>未達の原因・気づき</h3>${reasons.length?reasons.map(l=>`<p class="muted">${l.date}：${esc(l.reason)}</p>`).join(''):'<p class="muted">記録なし。学習記録時に理由を入力できます。</p>'}<div class="actions"><button onclick="copyReport()">ChatGPT分析用をコピー</button><button class="secondary" onclick="downloadReport()">JSON出力</button></div></div>${reviewArchive()}<div class="card"><h3>学習ログ</h3>${ls.slice().reverse().map(l=>`<div class="line"><div class="row"><div><b>${esc(l.title||state.tasks.find(t=>t.id===l.taskId)?.name||'教材')}</b><small>${l.date}｜${l.subject}｜${l.minutes}分${l.accuracy!==null&&l.accuracy!==undefined?'｜正答率'+l.accuracy+'%':''}</small></div><button class="danger" onclick="deleteLog('${l.id}')">削除</button></div></div>`).join('')||'<p class="muted">まだ記録がありません。</p>'}</div>`}
function report(){let w=weekly(selected);return {schema:'study-os-weekly-v3',week:w.dates[0],targets:{FAR:planTargets(selected).FAR/60,tax:planTargets(selected).国徴/60,regularBuffer:3,sundayEmergency:3},capacity:{required:w.required,buffer:w.regular,blocked:w.lost,sundayUsed:w.sunUsed,uncovered:w.uncovered},days:w.dates.map(date=>({date,type:typeOf(date),capacity:capacity(date),events:state.events.filter(e=>e.date===date)})),logs:state.logs.filter(l=>w.dates.includes(l.date)),tasks:state.tasks.map(t=>({id:t.id,name:t.name,subject:t.subject,status:t.status,mastery:t.mastery,due:t.due})),projection:projection(),instruction:'事実と推測を分け、勉強開始の障壁・教材進捗・正答率・睡眠を評価。改善案は最大2つ。合格保証をしない。'}}function copyReport(){let s='Study OSの週次データを分析し、日本語で、JSONオブジェクトのみを返してください。summary（実績の要約）、cause（根拠を示した原因の仮説）、action（具体策を最大2つ）、measure（翌週の検証指標）の値はすべて文字列にしてください。不足データは明記してください。\n'+JSON.stringify(report(),null,2);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>alert('コピーしました')).catch(()=>prompt('こちらをコピー',s));else prompt('こちらをコピー',s)}function downloadReport(){download('study-os-week-'+weekStart(selected)+'.json',JSON.stringify(report(),null,2))}function deleteLog(id){if(confirm('記録を削除しますか？'))mutate(()=>state.logs=state.logs.filter(l=>l.id!==id))}
function settingsView(){return `<h2>設定・バックアップ</h2><div class="card"><h3>学習計画（11/22開始版）</h3><button class="secondary" onclick="refreshApp()">最新版を読み込む</button><div class="grid"><div class="metric"><small>FAR</small><strong>受験前21h/週</strong></div><div class="metric"><small>国徴</small><strong>2→8→16→20h/週</strong></div><div class="metric"><small>通常予備</small><strong>3h/週</strong></div><div class="metric"><small>日曜緊急予備</small><strong>08–11時</strong></div></div><p class="muted">出社3日・リモート2日・土曜重点。日曜は予定変更で不足が発生したときだけ使用。</p><label>出社の曜日（3日選択推奨）</label><div class="chiprow">${[1,2,3,4,5].map(n=>`<label class="chip"><input type="checkbox" ${state.settings.officeDays.includes(n)?'checked':''} onchange="setOffice(${n},this.checked)"> ${names[n]}</label>`).join('')}</div><p class="fine">出社以外の平日はリモートになります。週ごとの例外は「今日」で変更できます。</p><div class="grid"><div><label>FAR受験日（仮）</label><input id="farExam" type="date" value="${state.settings.farExam}"></div><div><label>国徴受験日（未定なら空欄）</label><input id="taxExam" type="date" value="${state.settings.taxExam}"></div></div><label>FAR残タスク必要時間（仮見積もり）</label><input id="farNeed" type="number" min="1" max="2000" value="${state.settings.farNeed}"><div class="actions"><button onclick="saveSettings()">設定を保存</button></div><p class="fine">必要時間386hは教材の実測値ではありません。演習速度が分かったら更新してください。</p></div><div class="card"><h3>バックアップと復元</h3><div class="notice">このアプリの記録はiPhone内のブラウザ領域に保存されます。Safariデータの削除・端末故障・ホーム画面版の保存領域変更などで消える可能性があります。毎週バックアップを推奨します。</div><p class="muted">前回のバックアップ：${state.lastBackup||'未実施'}</p><div class="actions"><button onclick="backup()">全データをJSON保存</button><button class="secondary" onclick="$('restoreFile').click()">JSONから復元</button></div><input class="hide" type="file" id="restoreFile" accept=".json,application/json" onchange="restore(this)"></div><div class="card"><h3>データ移行について</h3><p class="muted">旧Study OS v1.2と同じ保存キーを使用します。既存の学習記録・教材状態を保持するための互換処理があります。ただし旧版の保存形式と画面は異なるため、更新前に旧版でバックアップしてください。</p><div class="actions"><button class="danger" onclick="resetAll()">全データを初期化</button></div></div><div class="card"><h3>運用上の制限</h3><p class="muted">時刻別の予定重複を考慮した学習ブロック再配置は実装しています。ただし同一教材の学習時間推定は暫定値で、タスク間の依存関係、問題数に基づく精密な最適化、通知、iOSウィジェット、学習成果の客観的合格確率予測は未対応です。週26時間を実際に実行できるかも検証が必要です。</p></div>`}
function setOffice(n,on){mutate(()=>{let a=new Set(state.settings.officeDays);on?a.add(n):a.delete(n);state.settings.officeDays=[...a];state.settings.remoteDays=[1,2,3,4,5].filter(i=>!a.has(i))})}function saveSettings(){let n=+$('farNeed').value;if(!$('farExam').value)return alert('FARの仮受験日を入力してください');if(!Number.isFinite(n)||n<=0)return alert('必要時間を確認してください');mutate(()=>{state.settings.farExam=$('farExam').value;state.settings.taxExam=$('taxExam').value;state.settings.farNeed=n})}function download(name,data){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}function backup(){state.lastBackup=today();save();download('study-os-backup-'+today()+'.json',JSON.stringify(state,null,2));render()}async function restore(input){let f=input.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.tasks)||!Array.isArray(data.logs)||!data.settings||!data.days)throw Error('Study OS形式ではありません');if(!confirm('現在のデータを上書きします。続けますか？'))return;state=migratePlan(data);state.events??=[];state.reviews??=[];state.settings.officeDays??=[1,2,3];state.settings.remoteDays??=[4,5];state.settings.farNeed??=386;state.settings.sundayProtected??=false;save();render();alert('復元しました')}catch(e){alert('復元できません：'+e.message)}}function resetAll(){if(confirm('データを初期化しますか？バックアップを先に作成してください。')&&confirm('本当に初期化しますか？')){state=seed();save();render()}}
render();setInterval(()=>{if(state.timer&&$('timerFace'))$('timerFace').textContent=fmt(Math.max(1,Math.floor((Date.now()-state.timer.started)/MIN)))},15000);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(document.getElementById('updateReady'))return;const button=document.createElement('button');button.id='updateReady';button.textContent='更新版を開く';button.onclick=refreshApp;document.querySelector('header').append(button);});}).catch(()=>{});
</script></body></html>
